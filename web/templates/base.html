{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}Heartcave{{end}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    <header class="bg-white border-b border-gray-200">
        <nav class="max-w-4xl mx-auto px-6 py-4 flex items-center gap-6">
            <a href="/" class="font-semibold text-lg tracking-tight">Heartcave</a>
            <a href="/blog" class="text-sm text-gray-600 hover:text-gray-900">Blog</a>
            <a href="/book" class="text-sm text-gray-600 hover:text-gray-900">Book a Session</a>
            <span class="ml-auto">
                <a href="/admin/posts" class="text-xs text-gray-400 hover:text-gray-600">Admin</a>
            </span>
        </nav>
    </header>
    <main class="max-w-4xl mx-auto px-6 py-10">
        {{block "content" .}}{{end}}
    </main>
</body>
</html>
{{end}}
