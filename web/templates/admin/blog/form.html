{{define "title"}}{{if .}}Edit Post{{else}}New Post{{end}} — Admin{{end}}
{{define "content"}}
<div class="max-w-2xl">
    <div class="mb-6">
        <a href="/admin/blog" class="text-sm text-blue-600 hover:underline">&larr; All posts</a>
        <h1 class="text-2xl font-bold mt-2">{{if .}}Edit Post{{else}}New Post{{end}}</h1>
    </div>

    {{if .}}
    <form method="POST" action="/admin/blog/{{.ID}}" class="space-y-5">
    {{else}}
    <form method="POST" action="/admin/blog" class="space-y-5">
    {{end}}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="title">Title</label>
            <input class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   type="text" id="title" name="title" value="{{if .}}{{.Title}}{{end}}" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="slug">Slug</label>
            <input class="w-full border border-gray-300 rounded px-3 py-2 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                   type="text" id="slug" name="slug" value="{{if .}}{{.Slug}}{{end}}" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="body">Body</label>
            <textarea class="w-full border border-gray-300 rounded px-3 py-2 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                      id="body" name="body" rows="16" required>{{if .}}{{.Body}}{{end}}</textarea>
        </div>
        <div class="flex items-center gap-2">
            <input type="checkbox" id="published" name="published"
                   {{if .}}{{if eq .Published 1}}checked{{end}}{{end}}
                   class="rounded border-gray-300">
            <label class="text-sm font-medium text-gray-700" for="published">Published</label>
        </div>
        <div class="flex gap-3">
            <button class="bg-blue-600 text-white font-medium py-2 px-6 rounded hover:bg-blue-700 transition-colors"
                    type="submit">
                {{if .}}Save Changes{{else}}Create Post{{end}}
            </button>
            <a href="/admin/blog" class="py-2 px-6 border border-gray-300 rounded text-gray-700 hover:bg-gray-50 transition-colors">
                Cancel
            </a>
        </div>
    </form>
</div>
{{end}}
