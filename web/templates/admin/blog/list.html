{{define "title"}}Posts — Admin{{end}}
{{define "content"}}
<div class="flex items-center justify-between mb-8">
    <h1 class="text-2xl font-bold">Posts</h1>
    <a href="/admin/blog/new"
       class="bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded hover:bg-blue-700 transition-colors">
        New Post
    </a>
</div>

{{if .}}
<div class="bg-white border border-gray-200 rounded overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
                <th class="text-left px-4 py-3 font-medium text-gray-700">Title</th>
                <th class="text-left px-4 py-3 font-medium text-gray-700">Slug</th>
                <th class="text-left px-4 py-3 font-medium text-gray-700">Status</th>
                <th class="text-left px-4 py-3 font-medium text-gray-700">Created</th>
                <th class="px-4 py-3"></th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
        {{range .}}
            <tr class="hover:bg-gray-50">
                <td class="px-4 py-3 font-medium">{{.Title}}</td>
                <td class="px-4 py-3 text-gray-500">{{.Slug}}</td>
                <td class="px-4 py-3">
                    {{if eq .Published 1}}
                        <span class="inline-block px-2 py-0.5 bg-green-100 text-green-800 rounded text-xs">Published</span>
                    {{else}}
                        <span class="inline-block px-2 py-0.5 bg-gray-100 text-gray-600 rounded text-xs">Draft</span>
                    {{end}}
                </td>
                <td class="px-4 py-3 text-gray-500">{{.CreatedAt}}</td>
                <td class="px-4 py-3 text-right space-x-3">
                    <a href="/admin/blog/{{.ID}}/edit" class="text-blue-600 hover:underline">Edit</a>
                    <form method="POST" action="/admin/blog/{{.ID}}/delete" class="inline"
                          onsubmit="return confirm('Delete this post?')">
                        <button type="submit" class="text-red-500 hover:underline">Delete</button>
                    </form>
                </td>
            </tr>
        {{end}}
        </tbody>
    </table>
</div>
{{else}}
<p class="text-gray-500">No posts yet. <a href="/admin/blog/new" class="text-blue-600 hover:underline">Create one.</a></p>
{{end}}
{{end}}
