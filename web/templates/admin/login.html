{{define "title"}}Admin Login — Heartcave{{end}}
{{define "content"}}
<div class="max-w-sm mx-auto mt-16">
    <h1 class="text-2xl font-bold mb-6 text-center">Admin Login</h1>

    {{if .Error}}
    <div class="mb-4 px-4 py-3 bg-red-50 border border-red-200 text-red-700 rounded text-sm">
        {{.Error}}
    </div>
    {{end}}

    <form method="POST" action="/admin/login" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email</label>
            <input class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   type="email" id="email" name="email" required autofocus>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
            <input class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                   type="password" id="password" name="password" required>
        </div>
        <button class="w-full bg-blue-600 text-white font-medium py-2 rounded hover:bg-blue-700 transition-colors"
                type="submit">
            Sign in
        </button>
    </form>
</div>
{{end}}
